<!doctype html>
<html lang="{{.Lang}}" dir="{{.Dir}}" data-theme="{{.Theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore the Countries GraphQL API">
  <title>GraphQL Explorer · Countries</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <a class="skip-link" href="#main-content">{{t .Lang "nav.skip_main"}}</a>
  <header class="header"><nav class="nav"><a class="nav-brand" href="/">Countries</a><div class="nav-links"><a class="nav-link" href="/search">{{t .Lang "nav.search"}}</a><a class="nav-link" href="/server/docs/swagger">REST API</a></div></nav>
  {{template "theme-preference" .}}{{template "language-selector" .}}</header>
  <main class="container" id="main-content">
    <h1>{{t .Lang "graphql.title"}}</h1>
    <p>{{t .Lang "graphql.description"}}</p>
    <form id="graphql-form">
      <label for="graphql-query">{{t .Lang "graphql.query"}}</label>
      <textarea id="graphql-query" name="query" rows="12" required>{ countries { name { common official } cca2 capital region currencies { code name symbol } } }</textarea>
      <button class="btn btn-primary" type="submit">{{t .Lang "graphql.run"}}</button>
    </form>
    <h2>{{t .Lang "graphql.response"}}</h2>
    <pre id="graphql-result" role="status" aria-live="polite">{{t .Lang "graphql.initial"}}</pre>
  </main>
  <script src="/static/js/graphql.js" defer></script>
</body>
</html>
