name: countries

x-logging: &default-logging
  options:
    max-size: "5m"
    max-file: "1"
  driver: json-file

services:
  countries:
    image: ghcr.io/apimgr/countries:latest
    container_name: countries-app
    hostname: countries
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PORT: 80
      TZ: ${TZ:-America/New_York}
      DATABASE_DIR: /data/db/sqlite
      CACHE_URL: valkey://countries-cache:6379
    volumes:
      - ./volumes/config:/config:z
      - ./volumes/data:/data:z
    ports:
      - "172.17.0.1:64580:80"
    healthcheck:
      test: ["CMD", "/usr/local/bin/countries", "--port", "80", "--status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      countries-cache:
        condition: service_healthy
    networks:
      - countries

  countries-cache:
    image: valkey/valkey:alpine
    pull_policy: always
    container_name: countries-cache
    restart: always
    logging: *default-logging
    volumes:
      - ./volumes/data/db/valkey:/data:z
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - countries

networks:
  countries:
    name: countries
    external: false
