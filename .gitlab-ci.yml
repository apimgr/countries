    - if [ -d "src/client" ]; then go build -tags gui -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-darwin-arm64 ./src/client; fi
  artifacts:
    paths:
      - ${PROJECT_NAME}-darwin-arm64*
