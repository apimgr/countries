# GitLab CI/CD Pipeline for countries
# Equivalent to GitHub Actions: release.yml, beta.yml, devel.yml, docker.yml

variables:
  PROJECT_NAME: "countries"
  PROJECT_ORG: "apimgr"
  INTERNAL_NAME: "countries"
  CGO_ENABLED: "0"
  GOFLAGS: "-buildvcs=false"
  GOOS: linux
  GOARCH: amd64
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go/mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go/build"
  # Go CI defaults to casjaysdev/go:latest — a docker/Dockerfile.build only for a genuine custom need, and then FROM casjaysdev/go:latest.
  BUILD_IMAGE: "casjaysdev/go:latest"

cache:
  key:
    files:
      - go.sum
  paths:
    - .cache/go/mod/
    - .cache/go/build/

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

stages:
  - security
  - test
  - build
  - package
  - release
  - docker

# =============================================================================
# SECURITY AND POLICY GATES
# =============================================================================

secret-scan:
  stage: security
  image:
    name: trufflesecurity/trufflehog:v3.99.0
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ] || [ "$CI_COMMIT_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
        trufflehog git file://. --exclude-paths=.github/trufflehog-exclude.txt --results=verified --fail
      elif [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        trufflehog git file://. --since-commit "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --branch "$CI_COMMIT_SHA" --exclude-paths=.github/trufflehog-exclude.txt --results=verified,unknown --fail
      else
        trufflehog git file://. --since-commit "$CI_COMMIT_BEFORE_SHA" --branch "$CI_COMMIT_SHA" --exclude-paths=.github/trufflehog-exclude.txt --results=verified,unknown --fail
      fi
  rules:
    - when: always

workflow-policy:
  stage: security
  image: alpine:latest
  script:
    - |
      bad=$(grep -RnE '^[[:space:]]*uses:' .github/ .gitea/ .forgejo/ 2>/dev/null | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
      if [ -n "$bad" ]; then
        echo "Unpinned third-party workflow actions found:"
        echo "$bad"
        exit 1
      fi
      if grep -R -nE '^[[:space:]]*pull_request_target:' .github/ .gitea/ .forgejo/; then
        echo "pull_request_target must not execute untrusted project code"
        exit 1
      fi
  rules:
    - when: always

vuln-scan:
  image: $BUILD_IMAGE
  stage: security
  script:
    - govulncheck ./...
  rules:
    - when: always

image-scan:
  stage: security
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
  script:
    - |
      mkdir -p "${TMPDIR:-/tmp}/${PROJECT_ORG}"
      SCAN_DIR="$(mktemp -d "${TMPDIR:-/tmp}/${PROJECT_ORG}/${INTERNAL_NAME}-XXXXXX")"
      trap 'rm -rf "$SCAN_DIR"' EXIT
      for variant in standard devel; do
        if [ "$variant" = standard ]; then dockerfile=docker/Dockerfile; tag=countries:ci; else dockerfile=docker/Dockerfile.dev; tag=countries:devel; fi
        docker build -t "$tag" -f "$dockerfile" .
        for command in bash curl tor i2pd tini; do
          docker run --rm --entrypoint sh "$tag" -c "command -v ${command} >/dev/null"
        done
        container="countries-image-check-$(date +%s)-$$"
        trap 'docker rm --force "$container" >/dev/null 2>&1 || true; rm -rf "$SCAN_DIR"' EXIT
        docker run --detach --name "$container" "$tag"
        deadline=$(( $(date +%s) + 180 ))
        tor_healthy=false
        while [ "$(date +%s)" -lt "$deadline" ]; do
          if docker exec "$container" curl --fail --silent --header 'Accept: text/plain' http://127.0.0.1/server/healthz | grep -Fq 'features.tor: healthy'; then
            tor_healthy=true
            break
          fi
          sleep 5
        done
        if [ "$tor_healthy" != true ]; then
          docker logs "$container"
          echo "Tor did not become healthy in $tag within 180 seconds" >&2
          exit 1
        fi
        docker rm --force "$container" >/dev/null
        docker save "$tag" -o "$SCAN_DIR/${variant}.tar"
        docker run --rm -v "$SCAN_DIR:/scan:ro" aquasec/trivy:latest image --input "/scan/${variant}.tar" --exit-code 1 --severity CRITICAL,HIGH
      done
  rules:
    - exists:
        - docker/Dockerfile
      when: always

# =============================================================================
# BUILD TEMPLATES
# =============================================================================

.go-build-template: &go-build
  image: $BUILD_IMAGE
  before_script:
    # NOTE: all tooling (git, bash, govulncheck, cyclonedx-gomod, etc.) is pre-installed
    # in casjaysdev/go:latest — never `apk add` or `go install` inside a CI job.
    - export VERSION="${CI_COMMIT_TAG#v}"
    - export COMMIT_ID="${CI_COMMIT_SHA:0:7}"
    - export BUILD_EPOCH="$(date -u +%s)"
    - export BUILD_DATE="$(date -u -d @${BUILD_EPOCH} +"%Y-%m-%dT%H:%M:%SZ")"
    # OFFICIAL_SITE (optional): site.txt wins; otherwise use CI/CD Variables or leave empty
    # Never guess or assume - must be explicitly defined by user
    - |
      if [ -f site.txt ]; then
        export OFFICIAL_SITE="$(cat site.txt)"
      else
        export OFFICIAL_SITE="${OFFICIAL_SITE:-}"
      fi
    - export LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.CommitID=${COMMIT_ID}' -X 'main.BuildEpoch=${BUILD_EPOCH}' -X 'main.OfficialSite=${OFFICIAL_SITE}'"

# =============================================================================
# RELEASE BUILDS (Tag Push: v* or semver)
# =============================================================================

build:linux-amd64:
  <<: *go-build
  stage: build
  variables:
    GOOS: linux
    GOARCH: amd64
  script:
    - go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-linux-amd64 ./src
    - if [ -d "src/client" ]; then go build -tags gui -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-linux-amd64 ./src/client; fi
    # Export RELEASE_VERSION via dotenv for the release job (`needs` on this
    # job) - a job's declarative release: block can only see predefined CI
    # variables or dotenv exported by an UPSTREAM job, never its own; this
    # job only runs on tag pipelines (see rules: below) so CI_COMMIT_TAG is
    # always set here, but the guard keeps release.env empty on any other trigger
    - if [ -n "$CI_COMMIT_TAG" ]; then echo "RELEASE_VERSION=${CI_COMMIT_TAG#v}" > release.env; fi
  artifacts:
    paths:
      - ${PROJECT_NAME}-linux-amd64*
    reports:
      dotenv: release.env
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/

